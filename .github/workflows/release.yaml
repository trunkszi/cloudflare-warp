name: Follow upstream WARP releases

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: Rebuild an already published version
        type: boolean
        default: false
      warp_version:
        description: Official WARP version (empty selects the latest common version)
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: warp-release
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.upstream.outputs.should_publish }}
      warp_version: ${{ steps.upstream.outputs.warp_version }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      image_tags: ${{ steps.upstream.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v6
      - name: Check official upstream packages and published releases
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
          WARP_VERSION: ${{ inputs.warp_version || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          versions = []
          for arch in ('amd64', 'arm64'):
              url = f'https://pkg.cloudflareclient.com/dists/noble/main/binary-{arch}/Packages'
              request = urllib.request.Request(url, headers={'User-Agent': 'cloudflare-warp-updater/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode()
              packages = set()
              for stanza in text.split('\n\n'):
                  fields = dict(line.split(': ', 1) for line in stanza.splitlines() if ': ' in line and not line[0].isspace())
                  if fields.get('Package') == 'cloudflare-warp':
                      version = fields['Version']
                      if not re.fullmatch(r'\d{4}\.\d+\.\d+\.\d+', version):
                          raise ValueError('Invalid official WARP version')
                      packages.add(version)
              versions.append(packages)
          common = versions[0] & versions[1]
          version = os.environ['WARP_VERSION'] or max(common, key=lambda v: tuple(map(int, v.split('.'))))
          if version not in common:
              raise ValueError('Requested WARP version is not available for both architectures')
          repository = os.environ['GITHUB_REPOSITORY']
          result = subprocess.run(['gh', 'api', '--paginate', '--jq', '.[] | @json',
                                   f'repos/{repository}/releases?per_page=100'],
                                  capture_output=True, text=True, check=True, timeout=120)
          releases = [json.loads(line) for line in result.stdout.splitlines()]
          tag = f'v{version}'
          publish = os.environ['FORCE_PUBLISH'] == 'true' or not any(
              r['tag_name'] == tag and not r['draft'] for r in releases)
          year, month, *_ = version.split('.')
          tags = [f'ghcr.io/{repository.lower()}:{t}' for t in (version, tag, f'{year}.{month}', 'latest')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'should_publish={str(publish).lower()}\nwarp_version={version}\nrelease_tag={tag}\n')
              output.write('image_tags<<TAGS\n' + '\n'.join(tags) + '\nTAGS\n')
          print(f'Latest shared noble package: {version}; should_publish={publish}')
          PY

  build-and-publish:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build native smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cloudflare-warp:test
          build-args: WARP_VERSION=${{ needs.check-upstream.outputs.warp_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify direct WARP listener and tunneled egress
        env:
          WARP_VERSION: ${{ needs.check-upstream.outputs.warp_version }}
        run: |
          set -euo pipefail
          name="warp-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs --tail 60 "$name"; docker rm -fv "$name"; docker image rm cloudflare-warp:test' EXIT
          docker run -d --name "$name" -p 127.0.0.1:40000:40000 cloudflare-warp:test
          ready=false
          for attempt in {1..60}; do
            if docker exec "$name" python3 /entrypoint.py --healthcheck && \
               curl --noproxy '' --connect-timeout 5 -m 10 -fsSLx socks5h://127.0.0.1:40000 \
                 https://www.cloudflare.com/cdn-cgi/trace > /tmp/warp-trace && \
               grep -Eq '^warp=on[[:space:]]*$' /tmp/warp-trace; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
          cat /tmp/warp-trace
          test "$(docker exec "$name" warp-cli --version | head -n 1)" = "warp-cli $WARP_VERSION"
          docker exec "$name" ss -lntp | tee /tmp/warp-listeners
          grep -E '0\.0\.0\.0:40000[[:space:]].*"warp-svc"' /tmp/warp-listeners
          for attempt in {1..15}; do
            docker top "$name" -eo pid,ppid,args > /tmp/warp-processes
            if test "$(tail -n +2 /tmp/warp-processes | wc -l)" -eq 3; then break; fi
            sleep 1
          done
          cat /tmp/warp-processes
          test "$(tail -n +2 /tmp/warp-processes | wc -l)" -eq 3
          grep -Eq '/usr/bin/python3 -u /entrypoint.py$' /tmp/warp-processes
          grep -Eq '/usr/bin/dbus-daemon --system --nofork --nopidfile$' /tmp/warp-processes
          grep -Eq '/usr/bin/warp-svc$' /tmp/warp-processes
          ! grep -Eq 'socat|supervisord|logrotate' /tmp/warp-processes
          docker exec "$name" python3 -c 'from pathlib import Path; assert Path("/proc/1/cmdline").read_bytes().split(b"\0")[:4] == [b"/usr/bin/python3", b"-u", b"/entrypoint.py", b""]'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.check-upstream.outputs.image_tags }}
          build-args: WARP_VERSION=${{ needs.check-upstream.outputs.warp_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check-upstream.outputs.warp_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [check-upstream, build-and-publish]
    if: needs.check-upstream.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish upstream version release
        env:
          GH_TOKEN: ${{ github.token }}
          WARP_VERSION: ${{ needs.check-upstream.outputs.warp_version }}
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
          IMAGE_TAGS: ${{ needs.check-upstream.outputs.image_tags }}
          IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" == "v$WARP_VERSION" ]]
          repository="${GITHUB_REPOSITORY,,}"
          cat > /tmp/release.md <<EOF_NOTES
          Official Cloudflare WARP **$WARP_VERSION** on Ubuntu 24.04 (\`linux/amd64\`, \`linux/arm64\`).

          Image tags:
          $IMAGE_TAGS

          Multi-architecture image digest: \`$IMAGE_DIGEST\`.

          \`docker run -d --name warp --restart always -p 40000:40000 ghcr.io/$repository:latest\`
          EOF_NOTES
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > /tmp/releases
          if grep -Fxq "$RELEASE_TAG" /tmp/releases; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file /tmp/release.md --draft=false --latest
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file /tmp/release.md --latest
          fi
